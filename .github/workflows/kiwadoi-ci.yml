name: Kiwadoi integration tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiwadoi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
            requirements-browser.txt
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          npm ci
          test -s models/eng.traineddata
          node -e "require.resolve('tesseract.js')"
          python -m playwright install --with-deps chromium
      - name: Run Python regression suite
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee python-test.log
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/simulation.js
          node --check web/research.js
          node --check api/ocr.js
      - name: Run real Chromium integration tests
        run: |
          set -o pipefail
          python -m unittest discover -s browser_tests -v 2>&1 | tee browser-test.log
      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwadoi-test-evidence-${{ github.run_id }}
          path: |
            python-test.log
            browser-test.log
            browser-test-artifacts/
          if-no-files-found: warn
          retention-days: 14
